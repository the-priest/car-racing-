# Builds Velocity Heat for Windows and Linux on every push.
# Download the builds from the run's "Artifacts" section (Actions tab).
# Pushing a tag like v1.0 also publishes a GitHub Release with both zips.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-tools
            ~/.local/share/godot/export_templates
          key: godot-4.7-stable-v1

      - name: Build Windows and Linux
        run: ./build.sh

      # A script that fails to compile still exports, and the game then hangs on the
      # loading screen, so check every script and load the world before shipping.
      - name: Script check and smoke test
        run: |
          GODOT=$(ls .godot-tools/Godot_v*_linux.x86_64)
          out=$(GODOT="$GODOT" sh tools/check.sh 2>&1)
          echo "$out"
          if echo "$out" | grep -q "SCRIPT ERROR"; then echo "::error::GDScript errors"; exit 1; fi
          timeout 180 "$GODOT" --headless --path . -- --gpstest > smoke.log 2>&1 || true
          tail -n 12 smoke.log
          grep -q "\[gps\] full reroute" smoke.log || { echo "::error::Smoke test did not finish (world failed to load or hung)"; exit 1; }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VelocityHeat-windows
          path: build/windows

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: VelocityHeat-linux
          path: build/VelocityHeat-linux.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VelocityHeat-*.zip
